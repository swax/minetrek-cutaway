name: Source checks
on: [push, pull_request, workflow_dispatch]
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: python scripts/format_code.py --check
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
      - if: runner.os == 'Windows'
        run: python run.py build-engine
      - if: runner.os == 'Windows'
        run: .\work\generic-bin\ClassicGeometryChecks.exe
      - if: runner.os == 'Windows'
        run: python run.py demo --backend cpu --frames 0,143 --output work/ci-demo
